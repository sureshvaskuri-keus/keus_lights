<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KEUS · Light Details</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#f4f0e9;--paper:#fffdfa;--ink:#111;--muted:#746e66;--line:#ddd6cc;
  --gold:#5b524a;--gold-dark:#5b524a;--black:#090909;
}
html,body{margin:0;min-height:100%;font-family:Inter,Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:var(--black);color:#fff}
.top-inner{max-width:1280px;margin:auto;min-height:66px;padding:0 24px;display:flex;align-items:center;gap:18px}
.brand{font-weight:700;letter-spacing:.38em;font-size:17px}
.sep{width:1px;height:18px;background:#444}
.top-title{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#c7c2bb}
.back{margin-left:auto;border:1px solid #555;background:transparent;color:#fff;border-radius:999px;padding:8px 13px;font-size:10px}
.back:hover{background:#fff;color:#111}
.shell{max-width:1280px;margin:auto;padding:30px 24px 48px}
.breadcrumb{margin-bottom:18px;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.layout{display:grid;grid-template-columns:minmax(340px,.9fr) minmax(0,1.15fr);background:var(--paper);border:1px solid var(--line)}
.visual{padding:28px;border-right:1px solid var(--line)}
.image-box{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid #eee9e2}
.image-box img{width:84%;height:84%;object-fit:contain}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.thumb{width:62px;height:62px;padding:4px;border:1px solid var(--line);background:#fff}
.thumb.active{border-color:#111}
.thumb img{width:100%;height:100%;object-fit:contain}
.finish-wrap{margin-top:18px}
.label{margin-bottom:8px;font-size:8px;letter-spacing:.13em;text-transform:uppercase;color:#8d867e}
.finishes{display:flex;gap:8px;flex-wrap:wrap}
.finish-btn{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 10px 6px 6px;font-size:9px}
.finish-btn.active{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.swatch{width:18px;height:18px;border-radius:50%;border:1px solid rgba(0,0,0,.14);background:#ddd}
.sw-white{background:#f7f6f1}.sw-mat-black{background:#181818}.sw-champagne-gold{background:linear-gradient(135deg,#8e6e3f,#e2ca96 45%,#a78450)}
.sw-rose-gold{background:linear-gradient(135deg,#8c5558,#d7a6a4 48%,#a56667)}.sw-brown{background:#684834}.sw-coffee{background:#4c372f}
.sw-dark-gray{background:#57595b}.sw-ballet-blue{background:#8faabd}.sw-chrome{background:linear-gradient(135deg,#656565,#f3f3f3 48%,#7d7d7d)}
.sw-chrome-black{background:linear-gradient(135deg,#111,#5c5c5c 44%,#171717)}.sw-standard{background:#d7d1c6}
.info{padding:34px}
.kicker{font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-bottom:9px}
h1{margin:0;font-family:Georgia,'Times New Roman',serif;font-size:44px;font-weight:400;line-height:1}
.price{margin:12px 0 22px;color:var(--gold-dark);font-size:18px;font-weight:700}
.description{margin:0 0 22px;color:#5f5952;font-size:12px;line-height:1.7;max-width:760px}
.spec-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-left:1px solid var(--line);border-top:1px solid var(--line)}
.spec{min-height:76px;padding:12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.spec-label{font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:#8e877e;margin-bottom:6px}
.spec-value{font-size:11px;line-height:1.45;overflow-wrap:anywhere}
.profile-only .spec-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.profile-only .price,.profile-only .finish-wrap,.profile-only .thumbs{display:none}
.profile-only .description{font-size:13px}
.variants{margin-top:22px}
.variants h2{font-family:Georgia,'Times New Roman',serif;font-size:22px;font-weight:400;margin:0 0 10px}
.table-wrap{overflow:auto;border:1px solid var(--line);background:#fff}
table{border-collapse:collapse;width:100%;min-width:1200px}
th,td{padding:9px 10px;border-right:1px solid #eee9e2;border-bottom:1px solid #eee9e2;text-align:left;white-space:nowrap}
th{font-size:8px;letter-spacing:.11em;text-transform:uppercase;color:#7f786f;background:#f7f4ef}
td{font-size:9px}
.variants.profile-only{display:none}
.status{padding:70px 20px;text-align:center;background:var(--paper);border:1px dashed var(--line)}
.status h2{font-family:Georgia,'Times New Roman',serif;font-size:28px;font-weight:400}
@media(max-width:780px){
  .top-inner{min-height:58px;padding:0 14px}
  .brand{font-size:14px}.sep,.top-title{display:none}
  .shell{padding:12px 10px 30px}
  .breadcrumb{margin:7px 2px 10px}
  .layout{grid-template-columns:1fr;border-radius:12px;overflow:hidden}
  .visual{padding:14px;border-right:0;border-bottom:1px solid var(--line)}
  .info{padding:18px 14px 20px}
  h1{font-family:Inter,Arial,sans-serif;font-size:28px;font-weight:750;letter-spacing:-.025em}
  .price{font-size:16px}
  .spec-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .spec{min-height:64px;padding:10px}
  .profile-only .spec-grid{grid-template-columns:1fr}
  .image-box{border-radius:10px}
}

/* Every available colour stays visible in one horizontal scroll row */
.finishes{
  display:flex!important;
  flex-wrap:nowrap!important;
  overflow-x:auto!important;
  overflow-y:hidden!important;
  padding-bottom:5px;
  scrollbar-width:thin;
  -webkit-overflow-scrolling:touch;
}
.finishes::-webkit-scrollbar{height:4px}
.finishes::-webkit-scrollbar-thumb{background:#c8c0b5;border-radius:999px}
.finish-btn{flex:0 0 auto!important}
@media(max-width:780px){
  .finishes{scrollbar-width:none!important}
  .finishes::-webkit-scrollbar{display:none!important}
}

  --gold-dark:#5b524a!important;
}
.price{color:#5b524a!important}
.finish-btn.active{

<body>
<header class="top"><div class="top-inner"><div class="brand">KEUS</div><div class="sep"></div><div class="top-title">Lighting · Product Details</div><button class="back" id="backBtn" type="button">← Back to Catalogue</button></div></header>
<main class="shell">
  <div class="breadcrumb" id="breadcrumb">Product details</div>
  <div id="app"><div class="status"><h2>Loading product…</h2></div></div>
</main>
<script>
(() => {
'use strict';
const CATEGORIES={
  downlights:{label:'Down Lights',file:'./data/downlights.csv'},
  tracklights:{label:'Track Lights',file:'./data/tracklights.csv'},
  profiles:{label:'Profiles',file:'./data/profiles.csv'},
  outdoor:{label:'Outdoor Lights',file:'./data/outdoor-lights.csv'}
};
const aliases={
  name:['name','product name','product'],
  itemNo:['item no','item number','itemno','item code'],
  vf:['vf','voltage'],imax:['imax','current','max current'],
  cct:['cct','colour temperature','color temperature'],cri:['cri'],
  cutout:['cutout','cut out','cut-out'],beam:['beam angle','beam','beamangle'],
  wattage:['wattage','watt','watts','power'],
  batchCode:['batch code','batch','batchcode'],
  stockCode:['stock code','stock','stockcode','sku'],
  bisNo:['bis no','bis number','bisno','bis registration no','bis registration number'],
  bisSpec:['bis sec','bissec','bis spec','bis specification','bisspec','bis standard','is standard'],
  mrp:['mrp','maximum retail price','retail price','price'],
  mfgBy:['mfg by','mfgby','manufacturer','manufactured by','manufacturing by','manufacturer name'],
  newDescription:['new description','newdescription','description','product description'],
  image:['image','image url','image link','imageurl'],
  finish:['finish','colour','color','finish colour','finish color']
};
const finishCodeMap={W:'White',B:'Mat Black',CG:'Champagne Gold',RG:'Rose Gold',BR:'Brown',COF:'Coffee',DGR:'Dark Gray',BB:'Ballet Blue',CH:'Chrome',CHB:'Chrome Black'};
const finishClasses={'White':'sw-white','Mat Black':'sw-mat-black','Champagne Gold':'sw-champagne-gold','Rose Gold':'sw-rose-gold','Brown':'sw-brown','Coffee':'sw-coffee','Dark Gray':'sw-dark-gray','Ballet Blue':'sw-ballet-blue','Chrome':'sw-chrome','Chrome Black':'sw-chrome-black','Standard':'sw-standard'};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const clean=s=>String(s??'').replace(/^\uFEFF/,'').trim().toLowerCase().replace(/[_-]+/g,' ').replace(/\s+/g,' ');
const unique=a=>[...new Set(a.map(v=>String(v??'').trim()).filter(Boolean))];
function delimiter(text){const first=text.replace(/^\uFEFF/,'').split(/\r?\n/).find(x=>x.trim())||'';let q=false,c={',':0,';':0,'\t':0};for(let i=0;i<first.length;i++){const ch=first[i];if(ch==='"'){if(q&&first[i+1]==='"'){i++;continue}q=!q;continue}if(!q&&ch in c)c[ch]++}return Object.entries(c).sort((a,b)=>b[1]-a[1])[0][0]}
function parseCSV(text){text=String(text??'').replace(/^\uFEFF/,'');const d=delimiter(text),rows=[];let row=[],cell='',q=false;for(let i=0;i<text.length;i++){const ch=text[i];if(q){if(ch==='"'&&text[i+1]==='"'){cell+='"';i++}else if(ch==='"')q=false;else cell+=ch}else{if(ch==='"')q=true;else if(ch===d){row.push(cell);cell=''}else if(ch==='\n'){row.push(cell);rows.push(row);row=[];cell=''}else if(ch!=='\r')cell+=ch}}if(cell.length||row.length){row.push(cell);rows.push(row)}return rows.filter(r=>r.some(v=>String(v).trim()))}
function sourceImageUrl(value){const raw=String(value||'').trim();if(!raw)return '';try{const u=new URL(raw,location.href);if(u.hostname==='wsrv.nl'||u.hostname==='images.weserv.nl'){let src=u.searchParams.get('url')||'';if(src&&!/^https?:\/\//i.test(src))src='https://'+src;return src||raw}}catch(_){}return raw}
function optimized(value,w=0){const raw=String(value||'').trim();if(!raw)return '';try{const u=new URL(raw,location.href);if(u.hostname==='wsrv.nl'||u.hostname==='images.weserv.nl'){u.protocol='https:';u.hostname='wsrv.nl';u.searchParams.set('output','webp');u.searchParams.set('q','78');if(w)u.searchParams.set('w',String(w));return u.toString()}if(u.hostname==='i.ibb.co'||u.hostname==='ibb.co'||u.hostname==='www.ibb.co'){const p=new URL('https://wsrv.nl/');p.searchParams.set('url',u.href);p.searchParams.set('output','webp');p.searchParams.set('q','78');if(w)p.searchParams.set('w',String(w));return p.toString()}}catch(_){}return raw}
function imageFallback(value){return sourceImageUrl(value)}
function imageErrorFallback(img){const f=img?.dataset?.fallback||'';if(f&&img.src!==f){img.dataset.fallback='';img.src=f}}
function normalizeFinishText(v){const x=clean(v).replace(/\bdefault\b/g,'').trim();const m={white:'White',w:'White',black:'Mat Black','mat black':'Mat Black','matte black':'Mat Black',b:'Mat Black','champagne gold':'Champagne Gold','champeing gold':'Champagne Gold',cg:'Champagne Gold','rose gold':'Rose Gold',rg:'Rose Gold',brown:'Brown',br:'Brown',coffee:'Coffee',cof:'Coffee','dark gray':'Dark Gray','dark grey':'Dark Gray',dgr:'Dark Gray','ballet blue':'Ballet Blue',bb:'Ballet Blue',chrome:'Chrome',ch:'Chrome','chrome black':'Chrome Black',chb:'Chrome Black'};return m[x]||String(v||'').trim()}
function inferFinish(r){const code=String(r.stockCode||'').trim().toUpperCase();const suffix=code.split('/').filter(Boolean).pop()||'';if(finishCodeMap[suffix])return finishCodeMap[suffix];const img=decodeURIComponent(sourceImageUrl(r.image)).toLowerCase().replace(/_/g,'-');const t=[[/chrome[- ]?black/,'Chrome Black'],[/champagne[- ]?gold|champeing[- ]?gold/,'Champagne Gold'],[/rose[- ]?gold/,'Rose Gold'],[/ballet[- ]?blue/,'Ballet Blue'],[/dark[- ]?gr(?:a|e)y/,'Dark Gray'],[/coffee|cofee/,'Coffee'],[/brown/,'Brown'],[/chrome|crome/,'Chrome'],[/mat[- ]?black|matte[- ]?black|black|balck/,'Mat Black'],[/white/,'White']];for(const [re,l] of t)if(re.test(img))return l;return 'Standard'}
function normalize(rows){if(rows.length<2)return[];const h=rows[0].map(String),map={};h.forEach((x,i)=>map[clean(x)]=i);const idx={};for(const f in aliases){idx[f]=-1;for(const a of aliases[f]){if(clean(a) in map){idx[f]=map[clean(a)];break}}}const get=(r,k)=>idx[k]>=0?String(r[idx[k]]??'').trim():'';return rows.slice(1).map(r=>{const o={};for(const k in idx)o[k]=get(r,k);o.finish=normalizeFinishText(o.finish)||inferFinish(o);return o}).filter(r=>r.name)}
function swatch(f){return `<span class="swatch ${finishClasses[f]||'sw-standard'}"></span>`}
function spec(l,v){const id=l==='Stock Code'?' id="selectedStockCode"':'';return `<div class="spec"><div class="spec-label">${esc(l)}</div><div class="spec-value"${id}>${esc(v||'—')}</div></div>`}
function summary(vals,join=' / '){const a=unique(vals);return a.length?a.join(join):'—'}

const params=new URLSearchParams(location.search);
const category=params.get('category')||'downlights';
const product=params.get('product')||'';
let selectedFinish=params.get('finish')||'';
const cfg=CATEGORIES[category]||CATEGORIES.downlights;
$('breadcrumb').textContent=`${cfg.label} · ${product||'Product Details'}`;
$('backBtn').addEventListener('click',()=>history.length>1?history.back():location.href='index.html');

(async()=>{
  const candidates=[cfg.file,cfg.file.replace('./data/','./')];
  let lastError=null;
  for(const file of candidates){
    try{
      const r=await fetch(encodeURI(file),{cache:'no-store'});
      if(!r.ok)throw new Error(`${r.status} ${r.statusText}`);
      return await r.text();
    }catch(err){lastError=err}
  }
  throw lastError||new Error('CSV file could not be loaded.');
})()
.then(text=>{
  const all=normalize(parseCSV(text));
  const rows=all.filter(r=>clean(r.name)===clean(product));
  if(!rows.length)throw new Error('Product not found in catalogue.');
  render(rows);
})
.catch(err=>{
  $('app').innerHTML=`<div class="status"><h2>Product details unavailable</h2><p>${esc(err.message)}</p></div>`;
});

function render(rows){
  const isProfile=category==='profiles';
  const name=rows[0].name;
  const finishes=unique(rows.map(r=>r.finish));
  if(!selectedFinish||!finishes.includes(selectedFinish))selectedFinish=finishes.includes('White')?'White':(finishes[0]||'');
  const selectedRows=isProfile?rows:(rows.filter(r=>r.finish===selectedFinish).length?rows.filter(r=>r.finish===selectedFinish):rows);
  const selectedVariant=selectedRows.find(r=>r.image)||selectedRows[0]||rows[0];
  const images=unique(selectedRows.map(r=>r.image));
  const main=(selectedVariant&&selectedVariant.image)||images[0]||'';
  const mrp=selectedVariant&&selectedVariant.mrp?selectedVariant.mrp:'—';
  const selectedStockCode=selectedVariant&&selectedVariant.stockCode?selectedVariant.stockCode:'—';
  const description=summary(rows.map(r=>r.newDescription),' ');
  let specs='';
  if(isProfile){
    specs=[
      ['Stock Code',summary(rows.map(r=>r.stockCode))],
      ['Cutout',summary(rows.map(r=>r.cutout))]
    ].map(([l,v])=>spec(l,v)).join('');
  }else{
    specs=[
      ['Stock Code',selectedStockCode],
      ['Item No.',summary(selectedRows.map(r=>r.itemNo))],
      ['Wattage',summary(selectedRows.map(r=>r.wattage))],
      ['CCT',summary(selectedRows.map(r=>r.cct))],
      ['Vf',summary(selectedRows.map(r=>r.vf))],
      ['Imax',summary(selectedRows.map(r=>r.imax))],
      ['CRI',summary(selectedRows.map(r=>r.cri))],
      ['Beam Angle',summary(selectedRows.map(r=>r.beam))],
      ['Cutout',summary(selectedRows.map(r=>r.cutout))],
      ['Batch Code',summary(selectedRows.map(r=>r.batchCode))],
      ['BIS No',summary(selectedRows.map(r=>r.bisNo))],
      ['BIS SEC',summary(selectedRows.map(r=>r.bisSpec))],
      ['MFG BY',summary(selectedRows.map(r=>r.mfgBy))]
    ].map(([l,v])=>spec(l,v)).join('');
  }

  $('app').innerHTML=`<section class="layout ${isProfile?'profile-only':''}">
    <div class="visual">
      <div class="image-box">${main?`<img id="mainImage" src="${esc(optimized(main,1200))}" data-fallback="${esc(imageFallback(main))}" onerror="imageErrorFallback(this)" alt="${esc(name)}">`:'<span>No image</span>'}</div>
      <div class="thumbs" id="thumbs">${images.map((u,i)=>`<button class="thumb ${i===0?'active':''}" type="button" data-img="${esc(u)}"><img src="${esc(optimized(u,160))}" data-fallback="${esc(imageFallback(u))}" onerror="imageErrorFallback(this)" alt=""></button>`).join('')}</div>
      <div class="finish-wrap">
        <div class="label">Available Finishes</div>
        <div class="finishes" id="finishes">${finishes.map(f=>`<button class="finish-btn ${f===selectedFinish?'active':''}" type="button" data-finish="${esc(f)}">${swatch(f)}<span>${esc(f)}</span></button>`).join('')}</div>
      </div>
    </div>
    <div class="info">
      <div class="kicker">${esc(isProfile?'Profile':'Lighting Product')}</div>
      <h1>${esc(name)}</h1>
      <div class="price" id="selectedRate">${isProfile?'':`MRP ${esc(mrp)}`}</div>
      ${description!=='—'?`<p class="description">${esc(description)}</p>`:''}
      <div class="spec-grid">${specs}</div>
    </div>
  </section>
  <section class="variants ${isProfile?'profile-only':''}">
    <h2>Available Variants</h2>
    <div class="table-wrap"><table>
      <thead><tr><th>Finish</th><th>CCT</th><th>Wattage</th><th>Beam</th><th>CRI</th><th>Cutout</th><th>Stock Code</th><th>MRP</th><th>BIS No</th><th>BIS SEC</th></tr></thead>
      <tbody>${selectedRows.map(r=>`<tr><td>${esc(r.finish)}</td><td>${esc(r.cct||'—')}</td><td>${esc(r.wattage||'—')}</td><td>${esc(r.beam||'—')}</td><td>${esc(r.cri||'—')}</td><td>${esc(r.cutout||'—')}</td><td>${esc(r.stockCode||'—')}</td><td>${esc(r.mrp||'—')}</td><td>${esc(r.bisNo||'—')}</td><td>${esc(r.bisSpec||'—')}</td></tr>`).join('')}</tbody>
    </table></div>
  </section>`;

  document.querySelectorAll('[data-img]').forEach(btn=>btn.addEventListener('click',()=>{
    document.querySelectorAll('[data-img]').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const im=$('mainImage');
    if(im){
      im.dataset.fallback=imageFallback(btn.dataset.img);
      im.src=optimized(btn.dataset.img,1200);
    }
    const row=selectedRows.find(r=>r.image===btn.dataset.img);
    if(row){
      const stock=$('selectedStockCode');
      const rate=$('selectedRate');
      if(stock)stock.textContent=row.stockCode||'—';
      if(rate&&!isProfile)rate.textContent=row.mrp?`MRP ${row.mrp}`:'MRP —';
    }
  }));

  document.querySelectorAll('[data-finish]').forEach(btn=>btn.addEventListener('click',()=>{
    selectedFinish=btn.dataset.finish;
    const url=new URL(location.href);
    url.searchParams.set('finish',selectedFinish);
    history.replaceState(null,'',url);
    render(rows);
  }));
}
})();
</script>
</body>
</html>
